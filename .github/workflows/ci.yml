name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Placeholders from .env.example — unit tests and Vite build do not
          # need live Supabase. Do not put real keys in CI.
          VITE_SUPABASE_URL: https://YOUR_PROJECT.supabase.co
          VITE_SUPABASE_ANON_KEY: your-anon-or-publishable-key
